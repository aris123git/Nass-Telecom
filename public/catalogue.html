<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boutique — Nass telecom</title>
  <meta name="description" content="Découvrez tous nos produits électroniques. Commande WhatsApp au +226 70 77 77 55." />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="page-transition" id="pageTransition" aria-hidden="true">
    <img src="/assets/logo-white.svg" alt="Nass telecom" />
  </div>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="/" class="brand" data-nav>
        <span class="brand-mark"><img src="/assets/logo-mark.svg" alt="Nass telecom" /></span>
        <span class="brand-text"><strong>Nass</strong><em>telecom</em></span>
      </a>
      <nav class="main-nav" id="mainNav">
        <a href="/" class="nav-link" data-nav>Accueil</a>
        <a href="/catalogue.html" class="nav-link active" data-nav>Boutique</a>
        <a href="/#contact" class="nav-link" data-nav>Contact</a>
      </nav>
      <div class="header-actions">
        <a href="/admin/" class="btn btn-ghost">Admin</a>
        <button class="nav-toggle" id="navToggle" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="catalog">
    <div class="container">
      <div class="catalog-head">
        <div>
          <span class="eyebrow">Boutique</span>
          <h1 class="c-blue">Nos produits</h1>
          <p class="c-blue" id="resultCount">Chargement…</p>
        </div>
      </div>

      <div class="catalog-layout">
        <aside class="catalog-filters">
          <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="searchInput" type="search" placeholder="Rechercher un produit…" />
          </div>
          <div class="filters-title">Catégories</div>
          <div class="filter-chips" id="filterChips">
            <div class="filter-chip active" data-slug="all">
              <span>Toutes</span>
              <span class="count" id="countAll">…</span>
            </div>
          </div>
        </aside>

        <section id="productsSection">
          <div class="products-grid" id="productsGrid">
            <div class="empty">Chargement des produits…</div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <span>© <span id="year"></span> Nass telecom. 📞 +226 70 77 77 55</span>
    </div>
  </footer>

  <a href="https://wa.me/22670777755" target="_blank" rel="noopener" class="whatsapp-fab" aria-label="Commander sur WhatsApp">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11 11 0 0 0 3.5 17.7L2 22l4.4-1.5A11 11 0 1 0 20.5 3.5zM12 20a8 8 0 0 1-4.1-1.1l-.3-.2-2.6.9.9-2.5-.2-.3A8 8 0 1 1 12 20zm4.6-5.8c-.3-.1-1.5-.7-1.8-.8s-.4-.1-.6.1c-.2.3-.6.8-.8 1s-.3.2-.5.1c-.3-.1-1.1-.4-2-1.3-.8-.7-1.3-1.5-1.4-1.8s0-.4.1-.5c.1-.1.3-.3.4-.5s.2-.3.2-.5-.1-.4-.2-.5c-.1-.1-.6-1.4-.8-1.9s-.4-.4-.5-.4h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.4s1 2.9 1.2 3.1c.1.2 2 3 4.7 4.2 1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2c-.1-.1-.3-.2-.6-.3z"/></svg>
  </a>

  <script src="/js/icons.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/catalogue.js"></script>
</body>
</html>
