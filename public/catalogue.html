<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boutique — Nass-Telecom</title>
  <meta name="description" content="Découvrez tous nos produits électroniques." />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="page-transition" id="pageTransition" aria-hidden="true">
    <span class="pt-logo">NASS-TELECOM</span>
  </div>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="/" class="brand" data-nav>
        <span class="brand-mark"><span class="brand-orb"></span></span>
        <span class="brand-text"><strong>Nass</strong><em>Telecom</em></span>
      </a>
      <nav class="main-nav" id="mainNav">
        <a href="/" class="nav-link" data-nav>Accueil</a>
        <a href="/catalogue.html" class="nav-link active" data-nav>Boutique</a>
        <a href="/#contact" class="nav-link" data-nav>Contact</a>
      </nav>
      <div class="header-actions">
        <a href="/admin" class="btn btn-ghost" data-nav>Admin</a>
        <button class="nav-toggle" id="navToggle" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="catalog">
    <div class="container">
      <div class="catalog-head">
        <div>
          <span class="eyebrow">Boutique</span>
          <h1>Nos <span class="grad">produits</span></h1>
          <p class="muted" id="resultCount">Chargement…</p>
        </div>
      </div>

      <div class="catalog-layout">
        <aside class="catalog-filters">
          <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="searchInput" type="search" placeholder="Rechercher un produit…" />
          </div>
          <div class="filters-title">Catégories</div>
          <div class="filter-chips" id="filterChips">
            <div class="filter-chip active" data-slug="all">
              <span>Toutes</span>
              <span class="count" id="countAll">…</span>
            </div>
          </div>
        </aside>

        <section id="productsSection">
          <div class="products-grid" id="productsGrid">
            <div class="empty">Chargement des produits…</div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <span>© <span id="year"></span> Nass-Telecom.</span>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/catalogue.js"></script>
</body>
</html>
